{% extends "base.html" %}

{% block title %}Recipes - Nutrition Tracker{% endblock %}

{% block content %}
<h2>Create a Recipe</h2>

<form method="POST" class="form-grid" id="recipe-form">
    <input name="recipe_name" placeholder="Recipe Name" required>

    <div id="ingredients-container">
        <div class="ingredient">
            <select name="food_id">
                {% for food in foods %}
                <option value="{{ food.id }}">{{ food.name }}</option>
                {% endfor %}
            </select>
            <input name="quantity" type="number" min="0" step="0.1" placeholder="Quantity (g)">
        </div>
    </div>

    <button type="button" onclick="addIngredient()">Add Another Ingredient</button>
    <button type="submit">Save Recipe</button>
</form>

<h2>Recipe List</h2>

<div id="recipe-list">
    {% for recipe in recipes %}
    <div id="recipe_{{ recipe.id }}" class="recipe-card" data-recipe="{{ recipe }}">how many recipes?</div>
    {% endfor %}
</div>

<script src="/static/script.js"></script>

<script>
    const foodsOptionsHTML = `{% for food in foods %}
        <option value="{{ food.id }}">{{ food.name }}</option>
    {% endfor %}`.trim();
</script>
{% endblock %}
